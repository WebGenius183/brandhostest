{% extends 'base.html' %}

{% block title %}Login - BrandHostest{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <!-- Header -->
    <div class="text-center mb-12">
        <h1 class="font-display text-4xl font-bold mb-4">Welcome Back</h1>
        <p class="text-gray-400">Sign in to your BrandHostest account</p>
    </div>
    
    <!-- Login Form -->
    <div class="card p-8 space-y-6">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <!-- Username -->
            <div>
                <label class="block text-sm font-semibold mb-3">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    placeholder="Enter your username"
                    class="w-full px-4 py-3 rounded-lg bg-slate-700 text-white"
                    required
                >
            </div>
            
            <!-- Password -->
            <div>
                <label class="block text-sm font-semibold mb-3">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 rounded-lg bg-slate-700 text-white"
                    required
                >
            </div>
            
            <!-- Remember Me -->
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="remember" class="w-4 h-4 accent-cyan-500">
                <span class="text-sm">Remember me</span>
            </label>
            
            <!-- Submit -->
            <button type="submit" class="btn-primary w-full mt-6">
                Sign In
            </button>
        </form>
        
        <!-- Divider -->
        <div class="relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-700"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-slate-800 text-gray-400">or</span>
            </div>
        </div>
        
        <!-- Social Login (placeholder) -->
        <div class="space-y-3">
            <button type="button" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-lg bg-slate-700 hover:bg-slate-600 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.372 0 0 5.373 0 12s5.372 12 12 12 12-5.373 12-12S18.628 0 12 0zm-2.5 18.5h-2v-9h2v9zm-1-10.27c-.62 0-1.123-.5-1.123-1.127 0-.627.503-1.127 1.123-1.127s1.122.5 1.122 1.127c0 .627-.5 1.127-1.122 1.127zM16.75 18.5h-2v-4.352c0-1.036-.018-2.368-1.445-2.368-1.446 0-1.668 1.129-1.668 2.295v4.425h-2v-9h1.92v1.227h.027c.268-.507.92-1.04 1.893-1.04 2.023 0 2.395 1.33 2.395 3.062v4.751z"/>
                </svg>
                <span>LinkedIn</span>
            </button>
            <button type="button" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-lg bg-slate-700 hover:bg-slate-600 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C15.503,1.607,13.93,1,12.545,1C6.477,1,1.635,5.842,1.635,11.91s4.842,10.91,10.91,10.91c6.5,0,10.868-4.618,10.868-11.1c0-0.78-0.086-1.221-0.239-1.738H12.545z"/>
                </svg>
                <span>Google</span>
            </button>
        </div>
    </div>
    
    <!-- Sign Up Link -->
    <div class="text-center mt-8">
        <p class="text-gray-400">Don't have an account? 
            <a href="{% url 'register' %}" class="text-cyan-400 hover:text-cyan-300 font-semibold">
                Create one now
            </a>
        </p>
    </div>
    
    <!-- Forgot Password -->
    <div class="text-center mt-4">
        <a href="#" class="text-gray-400 hover:text-cyan-400 text-sm">
            Forgot your password?
        </a>
    </div>
</div>
{% endblock %}
